name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: deno install --frozen

      - name: Format check
        run: deno task fmt --check

      - name: Lint
        run: deno task lint

      - name: Typecheck
        run: deno task check

      - name: Test
        run: deno task test

      - name: Build
        run: deno task build

      - name: Assert production base path
        run: |
          test -f dist/index.html
          grep -q '/studio/' dist/index.html
